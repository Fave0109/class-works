<!DOCTYPE html>
<html>
    <head>
        <title>Frist table Class Work</title>
        <style>
            table,th,tr,td{
                padding: 1rem;
                border: 1px solid green;
                border-collapse: collapse;
                width: 10%;
            }
            th{
                text-align: left;
            }
        </style>
    </head>
    <body>
        <table style="width: 70%;">
                <tr><th>Qty</th><th>Product</th><th>Unit</th><th>Total Price(N)</th></tr>
                <tr><td>2</td><td>Wrist Watch</td><td>1500</td><td>1500</td></tr>
                <tr><td>3</td><td>Necklace</td><td>2500</td><td>7500</td></tr>
                <tr><td>2</td><td>Shoes</td><td>30000</td><td>60000</td></tr>
                <tr><td colspan="2"></td><td>58500</td><td>72000</td></tr>
            </table>
    </body>
</html>
