<!DOCTYPE html>
<html>
    <head>
        <title>Executive Card</title>
        <style>
            .container{
                background: linear-gradient(270deg,lightgray 0%, gray 50%, skyblue 100%);
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 10px;
                justify-content: space-between;
                padding: 10px;
            }
            .pro-1{
                background-color: hsla(50, 70%, 75%, 0.4);
                height: 250px;
                width: 250px;
                line-height: 20px;
                padding: 20px;
                border: 2px solid rgba(40, 30, 112, 0.5);
                border-radius: 5px;
                box-sizing: border-box;
            }
            .pro-2{
                background-color: hsla(50, 40%, 75%, 0.4);
                height: 250px;
                width: 250px;
                line-height: 20px;
                padding: 20px;
                border: 2px solid rgba(40, 30, 112, 0.5);
                border-radius: 5px;
                box-sizing: border-box;
            }
            .pro-3{
                background-color: hsla(50, 40%, 75%, 0.4);
                height: 250px;
                width: 250px;
                line-height: 20px;
                padding: 20px;
                border: 2px solid rgba(40, 30, 112, 0.5);
                border-radius: 5px;
                box-sizing: border-box;
            }
            .pro-1 img, .pro-2 img, .pro-3 img{
                height: 90px;
                width: 90px;
                border-radius: 50%;
                border: 2px solid rgba(40, 30, 112, 0.5);
            }
        </style>
    </head>
    <body>
        <h2>Names Of Executives.</h2>
        <div class="container">
            <div class="pro-1">
                <img src="Images/President.jpg" height="100px" width="100px"><br>
                <h4><b>Comr. Ajisebutu Dolapo</b></h4>
                <p><i>President</i></p>
            </div>
            <div class="pro-2">
                <img src="Images/Gen. Secertary.jpg" height="100px" width="100px"><br>
                <h4><b>Comr. Ajayi-Obe Eniola</b></h4>
                <p><i>General Secertary</i></p>
            </div>
            <div class="pro-3">
                <img src="Images/Fin. Sec..jpg" height="100px" width="100px"><br>
                <h4><b>Comr. Olusola Favour</b></h4>
                <p><i>Finicial Secretary</i></p>
            </div>
        </div>
    </body>
</html>
